services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bubbles
      POSTGRES_PASSWORD: bubbles
      POSTGRES_DB: bubbles
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  clustering:
    build:
      context: ./apps/clustering
    stdin_open: true
    tty: true

  backend:
    build:
      context: ./apps/backend
    ports:
      - "3001:3001"
    env_file:
      - .env
    depends_on:
      - db
      - ollama

  frontend:
    build:
      context: ./apps/frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend

volumes:
  db_data:
  ollama_data:
