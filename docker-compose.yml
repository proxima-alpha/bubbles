services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bubbles
      POSTGRES_PASSWORD: bubbles
      POSTGRES_DB: bubbles
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  ollama-init:
    image: ollama/ollama
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list > /dev/null 2>&1; do sleep 1; done
        ollama pull nomic-embed-text
        ollama pull exaone3.5:2.4b

  clustering:
    build:
      context: ./apps/clustering
    stdin_open: true
    tty: true

  backend:
    build:
      context: ./apps/backend
    ports:
      - "3001:3001"
    env_file:
      - ./apps/backend/.env
    depends_on:
      - db
      - ollama

  frontend:
    build:
      context: ./apps/frontend
    ports:
      - "3000:3000"
    env_file:
      - ./apps/frontend/.env
    depends_on:
      - backend

volumes:
  db_data:
  ollama_data:
